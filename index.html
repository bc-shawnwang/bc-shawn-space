<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bc-shawn-space</title>
<style>
  :root{
    --bg:#10141b;
    --surface:#171c25;
    --surface-2:#1c2230;
    --border:#2a3140;
    --border-soft:#232a38;
    --text:#e9e7e0;
    --muted:#8b93a3;
    --amber:#e8a33d;
    --amber-dim:#4a3c22;
    --violet:#8b7cf0;
    --violet-dim:#332d55;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;line-height:1.55;}
  main{max-width:760px;margin:0 auto;padding:56px 24px 80px;}
  a{color:var(--amber);text-decoration:none;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);display:inline-block;}
  h1{
    font-size:clamp(28px,4vw,40px);
    line-height:1.15;
    letter-spacing:-0.01em;
    margin:0 0 12px;
  }
  p.lede{color:var(--muted);margin:0 0 40px;max-width:560px;}
  ul.pages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  li.page{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px 20px;
    transition:border-color .15s ease, background .15s ease;
  }
  li.page:hover{border-color:var(--amber-dim);background:var(--surface-2);}
  li.page a{
    display:block;
    color:var(--text);
    font-weight:600;
    font-size:16px;
    border-bottom:none;
  }
  li.page a:hover{color:var(--amber);}
  li.page .desc{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
  }
  footer{
    margin-top:56px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:12px;
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot"></span>bc-shawn-space</div>
  <h1>Index</h1>
  <p class="lede">explore</p>
  <ul class="pages">
    <li class="page">
      <a href="LaunchDarkly-Flag-Experimentation/index.html">LaunchDarkly · Experimentation reshuffling</a>
      <div class="desc">LaunchDarkly-Flag-Experimentation/</div>
    </li>
  </ul>
  <footer>github pages</footer>
</main>
</body>
</html>
