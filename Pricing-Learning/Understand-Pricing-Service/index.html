<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Understand Pricing Service</title>
<style>
:root{
  --bg:#10141b;
  --surface:#171c25;
  --surface-2:#1c2230;
  --border:#2a3140;
  --border-soft:#232a38;
  --text:#e9e7e0;
  --muted:#8b93a3;
  --amber:#e8a33d;
  --amber-dim:#4a3c22;
  --amber-bg:rgba(232,163,61,0.13);
  --violet:#8b7cf0;
  --blue-bg:rgba(55,138,221,0.14);
  --blue-text:#7fb4e8;
  --teal-bg:rgba(29,158,117,0.16);
  --teal-text:#63d6ab;
  --red-bg:rgba(226,92,92,0.14);
  --red-text:#f09a9a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{-webkit-font-smoothing:antialiased;line-height:1.6;}
main{max-width:920px;margin:0 auto;padding:56px 24px 96px;}
a{color:var(--amber);}
a:hover{text-decoration:underline;}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);display:inline-block;}
.eyebrow a{color:var(--muted);text-decoration:none;}
.eyebrow a:hover{color:var(--amber);}
.eyebrow .sep{opacity:.5;}

h1{font-size:clamp(26px,3.8vw,36px);line-height:1.18;letter-spacing:-0.01em;margin:0 0 12px;}
h2{font-size:20px;font-weight:650;margin:56px 0 6px;scroll-margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
h3{font-size:15.5px;font-weight:650;margin:30px 0 8px;}
h4{font-size:13px;font-weight:650;margin:22px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
p{margin:0 0 14px;}
p.lede{color:var(--muted);margin:0 0 28px;max-width:680px;font-size:15px;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
hr.sep{border:none;border-top:1px solid var(--border);margin:44px 0 0;}

code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:12.5px;font-family:var(--mono);border:1px solid var(--border);word-break:break-word;}
pre.code{background:#0a0d12;color:#c9d1d9;border-radius:8px;padding:14px 16px;font-size:12px;line-height:1.55;font-family:var(--mono);overflow-x:auto;margin:10px 0 18px;border:1px solid var(--border);white-space:pre;}
pre.code .k{color:#79c0ff;}      /* keys / types */
pre.code .s{color:#a5d6a7;}      /* strings */
pre.code .n{color:#ffa657;}      /* numbers */
pre.code .c{color:#6e7681;}      /* comments */
pre.code .f{color:#d2a8ff;}      /* fields / fragments */
.file{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:14px 0 -4px;}
ul,ol{padding-left:20px;margin:0 0 14px;}
li{margin-bottom:8px;}

/* badges */
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);vertical-align:middle;white-space:nowrap;}
.badge.wip{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-dim);}
.badge.live{background:var(--teal-bg);color:var(--teal-text);border-color:rgba(29,158,117,.35);}
.badge.unverified{background:var(--red-bg);color:var(--red-text);border-color:rgba(226,92,92,.3);}

/* callouts */
.callout{border-radius:8px;padding:12px 16px;font-size:13.5px;margin:0 0 14px;border:1px solid transparent;}
.callout.blue{background:var(--blue-bg);color:var(--blue-text);}
.callout.teal{background:var(--teal-bg);color:var(--teal-text);}
.callout.amber{background:var(--amber-bg);color:var(--amber);}
.callout.red{background:var(--red-bg);color:var(--red-text);}
.callout code{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.1);color:inherit;}
.callout strong{color:inherit;}

/* tables */
.card-table{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto;margin:10px 0 20px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--border);vertical-align:top;}
thead th{border-top:none;font-weight:600;background:var(--surface-2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
td.t{white-space:nowrap;}
tr.hl td{background:rgba(232,163,61,.07);}

/* definition grid */
dl.terms{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:0;margin:10px 0 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
dl.terms dt,dl.terms dd{padding:11px 14px;border-top:1px solid var(--border);margin:0;font-size:13.5px;}
dl.terms dt:first-of-type,dl.terms dd:first-of-type{border-top:none;}
dl.terms dt{font-weight:600;color:var(--text);background:var(--surface-2);}
dl.terms dd{color:var(--text);}
dl.terms dd .muted{font-size:12.5px;}
@media(max-width:640px){dl.terms{grid-template-columns:1fr;}dl.terms dt{border-top:1px solid var(--border);}dl.terms dd{border-top:none;}}

/* group headings inside terms */
.termgroup{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin:28px 0 -4px;}

/* page cards (sub page links) */
ul.pages{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
li.page{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:0;transition:border-color .15s ease, background .15s ease;}
li.page:hover{border-color:var(--amber-dim);background:var(--surface-2);}
li.page a{display:block;color:var(--text);font-weight:600;font-size:16px;text-decoration:none;}
li.page a:hover{color:var(--amber);}
li.page .desc{color:var(--muted);font-size:13.5px;margin-top:4px;}

/* table of contents */
nav.toc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin:0 0 8px;}
nav.toc .title{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
nav.toc ol{margin:0;padding-left:20px;columns:2;column-gap:28px;}
nav.toc li{margin-bottom:5px;font-size:13.5px;break-inside:avoid;}
nav.toc a{text-decoration:none;}
@media(max-width:640px){nav.toc ol{columns:1;}}

/* animated request chain */
.flow-caption{color:var(--muted);font-size:12.5px;margin:0 0 10px;}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0 20px;}
.flow .node{flex:1 1 150px;min-width:140px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px;background:var(--surface);animation:nodePulse 8s infinite ease;}
.flow .node small{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
.flow .node b{font-weight:600;}
.flow .node .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em;}
.flow .node:nth-child(1){animation-delay:0s;}
.flow .node:nth-child(2){animation-delay:.9s;}
.flow .node:nth-child(3){animation-delay:1.8s;}
.flow .node:nth-child(4){animation-delay:2.7s;}
.flow .node:nth-child(5){animation-delay:3.6s;}
.flow .node:nth-child(6){animation-delay:4.5s;}
.flow .node:nth-child(7){animation-delay:5.4s;}
.flow .node.grpc{--c:29,158,117;}
.flow .node.http{--c:55,138,221;}
.flow .node.gql{--c:139,124,240;}
.flow .node{--c:232,163,61;}
@keyframes nodePulse{
  0%,2%{box-shadow:none;border-color:var(--border);}
  6%{box-shadow:0 0 0 2px rgba(var(--c),.5);border-color:rgb(var(--c));}
  16%,100%{box-shadow:none;border-color:var(--border);}
}
@media(prefers-reduced-motion:reduce){.flow .node{animation:none;}html{scroll-behavior:auto;}}

/* interactive switcher */
.switcher{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0 20px;}
.switcher .label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.seg button{font:inherit;font-size:12.5px;font-family:var(--mono);background:var(--surface-2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;}
.seg button:hover{color:var(--text);}
.seg button[aria-pressed="true"]{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-dim);}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.out .cell{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;font-size:13px;}
.out .cell .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:3px;}
.out .cell.yes{border-color:rgba(29,158,117,.45);}
.out .cell.no{opacity:.6;}
.out .note{grid-column:1/-1;font-size:13px;color:var(--muted);}
.items{margin-top:12px;}
.items .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12.5px;}
.items .row .alias{font-family:var(--mono);color:var(--violet);min-width:190px;}
.items .row .item{font-family:var(--mono);color:#c9d1d9;}
.items .row.dedup{opacity:.55;}

footer{margin-top:64px;color:var(--muted);font-family:var(--mono);font-size:12px;display:flex;gap:18px;flex-wrap:wrap;}
footer a{color:var(--muted);}
footer a:hover{color:var(--amber);}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot"></span><a href="../../index.html">bc-shawn-space</a><span class="sep">/</span><a href="../index.html">Pricing Learning</a><span class="sep">/</span>Understand Pricing Service</div>
  <h1>Understand Pricing Service <span class="badge wip">WIP</span></h1>
  <p class="lede">WIP</p>
  <footer><a href="../index.html">&larr; back to Pricing Learning</a></footer>
</main>
</body>
</html>
